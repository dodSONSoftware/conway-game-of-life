[package]
name = "game-of-life-bevy"
version = "0.1.0"
repository = "http://10.10.10.7:30008/games/game-of-life"
edition = "2024"
description = "Conway's Game of Life - three-generation desktop simulation"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
bevy = "=0.20.0"
bevy_egui = "=0.43.1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
rfd = "0.15"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }
